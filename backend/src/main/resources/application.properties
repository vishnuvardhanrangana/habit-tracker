server.port=8080

# Database Configuration
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:habit_tracker}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:rootroot}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT settings
jwt.secret=${JWT_SECRET:9a4f2c8d3b7a1e5c8f6b3d2e1a9c8e7d6f5b4a3c2b1a0d9e8f7c6b5a4d3c2b1a}
jwt.expiration=86400000

# File Upload / Multipart
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB

# Seed User Passwords
app.users.stupid.password=${STUPID_PASSWORD:stupid@0928}
app.users.idiot.password=${IDIOT_PASSWORD:idiot@0928}

